[pytest]
testpaths = tests

# Özel işaretler burada tanıtılmazsa pytest "bilinmeyen marker" uyarısı verir.
# e2e: gerçek bir uvicorn sunucusu başlatan yavaş testler. CI'da ayrı bir
# adım olarak çalışır; yerelde atlamak için: pytest -m "not e2e"
markers =
    e2e: gercek sunucu baslatan uctan uca testler (yavas)
